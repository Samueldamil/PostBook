<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostBook - Register</title>
    <link rel="stylesheet" href="./styles/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header class="header">
        <img class="logo" src="./images/logo.png" alt="Logo" />
        <nav>
            <a href="login.html">Login</a>
        </nav>
    </header>
    
    <section class="entry-section">
        <div class="container">
            <h1>Create an Account</h1>
            <form id="registerForm">
                <input id="username" type="text" placeholder="Username" name="username" required>
                <input id="email" type="email" placeholder="Email" name="email" required>
                <div class="password-container">
                    <input id="password" type="password" name="password" placeholder="Password" required>
                    <span class="togglePassword-icon"><i class="fa-solid fa-eye-slash"></i></span>
               </div>
                <button type="submit" id="submitBtn">Register</button>
		<span class="loader" id="loading" style="display: none;"></span>
            </form>
        </div>
        <p>Already have an account? <a href="login.html">Login here</a></p>
    </section>
    <script src="./scripts/register.js"></script>
    <script>
        const passwordField = document.getElementById("password");
        const togglePassword = document.querySelector(".togglePassword-icon i");
        
        togglePassword.addEventListener("click", function () {
            if (passwordField.type === "password") {
                passwordField.type = "text";
                togglePassword.classList.remove("fa-eye-slash");
                togglePassword.classList.add("fa-eye");
            }
            else {
                passwordField.type = "password";
                togglePassword.classList.remove("fa-eye");
                togglePassword.classList.add("fa-eye-slash");
            }
        });
    </script>
</body>
</html>
