<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostBook - Edit</title>
    <link rel="stylesheet" href="./styles/style.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header class="header">
        <img class="logo" src="./images/logo.png" alt="Logo" />
        <nav>
            <a href="index.html"><i class="fa-solid fa-arrow-left"></i></a>
        </nav>
    </header>
    
    <section class="edit-section">
        <div class="container">
            <h1>Edit Post</h1>
            <form id="editForm">
               <textarea id="content" name="content" placeholder="Write something..." required></textarea>
               <button id="submitBtn">Edit</button>
	       <span class="loader" id="loading" style="display: none;"></span>
            </form>
        </div>
    </section>

    <script src="./scripts/auth-check.js"></script>
    <script src="./scripts/edit.js"></script>
</body>
</html>
